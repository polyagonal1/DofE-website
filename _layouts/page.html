<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-GB" }}">

    {% include head.html extra_style=page.extra_style extra_scripts=page.extra_scripts %}

    <body>
        {% include header.html %}

        <main role="main">
            {% unless page.url == "/" %}
                <h1>{{ page.title }}</h1>
            {% endunless %}

            {{ content }}
        </main>

    </body>
</html>
